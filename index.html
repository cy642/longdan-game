<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122c30">
  <meta name="description" content="龙胆：逆命三国，电脑版双章节动作冒险。操控赵云，长坂救主，汉水设伏。">
  <title>龙胆：逆命三国 · 电脑版试玩</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10292e;color:#e9e2c5}
    main{width:min(520px,90vw);padding:36px;text-align:center;border:1px solid #526c62;border-radius:8px;background:#122c30}
    h1{margin:0 0 16px;font-size:30px;font-weight:500;color:#f0dbab}
    p{line-height:1.8;color:#b9cbb6}
    #game-link{display:inline-block;margin:12px 0;padding:12px 30px;border:1px solid #d6bd7c;border-radius:5px;background:#33564b;color:#f7ebc8;text-decoration:none}
    a:focus-visible{outline:2px solid #f0dbab;outline-offset:4px}
    footer{margin-top:24px}footer a{color:#91afa2;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>龙胆：逆命三国</h1>
    <p>正在进入电脑版试玩……</p>
    <a id="game-link" href="./godot-play/">进入游戏</a>
    <noscript><p>点击“进入游戏”打开正式试玩入口。</p></noscript>
    <footer><a href="./legacy.html">旧 Canvas 原型</a></footer>
  </main>
  <script>
    // One navigation only; keep project-relative GitHub Pages paths and links.
    const gameUrl = new URL('./godot-play/', window.location.href);
    gameUrl.search = window.location.search;
    gameUrl.hash = window.location.hash;
    document.getElementById('game-link').href = gameUrl.href;
    window.location.replace(gameUrl.href);
  </script>
</body>
</html>
