[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="art/ui/OFL.txt,art/ui/NOTICE.txt"
exclude_filter="tests/*,web/*,README.md"
export_path="../builds/Changban3D/Longdan-Changban-3D.exe"
script_export_mode=2

[preset.0.options]
binary_format/embed_pck=true
binary_format/architecture="x86_64"
debug/export_console_wrapper=0
application/icon="res://art/ui/longdan.svg"
application/file_version="0.1.0"
application/product_version="0.1.0"
application/product_name="龙胆：逆命三国 · 长坂坡 3D"
codesign/enable=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="art/ui/OFL.txt,art/ui/NOTICE.txt"
exclude_filter="tests/*,web/*,README.md"
export_path="../changban-3d-play/index.html"
script_export_mode=2

[preset.1.options]
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=0
html/export_icon=true
html/focus_canvas_on_start=true
